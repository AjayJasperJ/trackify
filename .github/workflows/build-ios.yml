name: Build IPA

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code (freezed/json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Sync CocoaPods (Force Static Linkage)
        run: |
          flutter build ios --config-only || true
          cd ios
          pod install --repo-update

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --verbose

      - name: Create unsigned IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          
          # Strip nested Info.plist and PrivacyInfo ONLY from .bundle directories to prevent AltStore Sandbox crash
          find build/ios/ipa/Payload/Runner.app -name "*.bundle" -type d -exec find {} -name "Info.plist" -delete \;
          find build/ios/ipa/Payload/Runner.app -name "*.bundle" -type d -exec find {} -name "PrivacyInfo.xcprivacy" -delete \;
          find build/ios/ipa/Payload/Runner.app -name "_CodeSignature" -exec rm -rf {} +
          
          # Preserve execute permissions before zipping
          chmod +x build/ios/ipa/Payload/Runner.app/Runner
          find build/ios/ipa/Payload/Runner.app/Frameworks -type f -exec chmod +x {} +
          
          cd build/ios/ipa
          zip -r trackify-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: trackify-ipa-unsigned
          path: build/ios/ipa/trackify-unsigned.ipa
          retention-days: 30