name: Build IPA

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code (freezed/json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Sync CocoaPods (Force Static Linkage)
        run: |
          flutter build ios --config-only || true
          cd ios
          pod install --repo-update

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --verbose

      - name: Create unsigned IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          
          # Strip nested Info.plist and PrivacyInfo ONLY from .bundle directories to prevent AltStore Sandbox crash
          find build/ios/ipa/Payload/Runner.app -name "*.bundle" -type d -exec find {} -name "Info.plist" -delete \;
          find build/ios/ipa/Payload/Runner.app -name "*.bundle" -type d -exec find {} -name "PrivacyInfo.xcprivacy" -delete \;
          find build/ios/ipa/Payload/Runner.app -name "_CodeSignature" -exec rm -rf {} +
          
          # Preserve execute permissions before zipping
          chmod +x build/ios/ipa/Payload/Runner.app/Runner
          find build/ios/ipa/Payload/Runner.app/Frameworks -type f -exec chmod +x {} +
          
          cd build/ios/ipa
          zip -r trackify-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: trackify-ipa-unsigned
          path: build/ios/ipa/trackify-unsigned.ipa
          retention-days: 30

      - name: Delete Previous GitHub Release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
        run: |
          gh release delete ios-latest --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: "iOS Release - Unsigned IPA (Latest)"
          body: |
            ⚠️ **Unsigned IPA** — This build is not signed and cannot be installed directly on a device without re-signing.

            To install:
            - Use **AltStore**, **Sideloadly**, or **iOS App Installer** to sideload.
            - Or re-sign with your own certificate using **Xcode** / **codesign**.
          files: build/ios/ipa/trackify-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}